<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>女ヲタヲタシミュレータ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: one narrow column like a phone screen; a ticket-stub scene header, live meters, narration, choices, reaction bubbles */
:root{
  --bg:#f4f0f8; --paper:#ffffff; --ink:#2a2136; --muted:#6c6278; --line:#ddd3e8;
  --pink:#d6336f; --pink-soft:#fbe3ec; --sky:#1b7fa3; --sky-soft:#dff0f6;
  --warn:#c25a00; --danger:#c0262d; --ok:#2a8a4a;
  --f-display:"DotGothic16",ui-monospace,monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1422; --paper:#251d31; --ink:#f1eaf7; --muted:#a99dba; --line:#3a2f49;
  --pink:#ff7aa8; --pink-soft:#3d2234; --sky:#6cc7e6; --sky-soft:#1c3340;
  --warn:#f0a050; --danger:#ff6a6f; --ok:#6fd38f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1422; --paper:#251d31; --ink:#f1eaf7; --muted:#a99dba; --line:#3a2f49;
  --pink:#ff7aa8; --pink-soft:#3d2234; --sky:#6cc7e6; --sky-soft:#1c3340;
  --warn:#f0a050; --danger:#ff6a6f; --ok:#6fd38f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px}
/* title */
.logo{font-family:var(--f-display);font-size:clamp(30px,8vw,44px);line-height:1.15;color:var(--pink)}
.logo small{display:block;font-size:.42em;color:var(--muted);letter-spacing:.08em;margin-top:6px}
.lead{color:var(--ink)}
.notice{font-size:13px;color:var(--muted);border-left:3px solid var(--sky);padding-left:10px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;background:var(--pink);color:#fff;font-weight:700;font-size:16px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--pink);border:1.5px solid var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:10px}
details{border-top:1px dashed var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 0;padding-left:1.2em;display:grid;gap:6px;font-size:14px}
/* hud */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter b{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);display:flex;justify-content:space-between}
.meter b span{font-variant-numeric:tabular-nums;color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .5s ease}
.m-kou i{background:var(--ok)} .m-hiki i{background:var(--danger)} .m-sara i{background:var(--warn)}
/* ticket */
.ticket{display:flex;border:1.5px dashed var(--pink);border-radius:8px;overflow:hidden;background:var(--pink-soft)}
.ticket .no{font-family:var(--f-display);padding:10px 14px;border-right:1.5px dashed var(--pink);color:var(--pink);font-size:13px;line-height:1.3;text-align:center;flex:0 0 auto}
.ticket .no strong{display:block;font-size:22px;font-weight:400}
.ticket .place{padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ticket .place small{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.ticket .place span{font-weight:700}
.talk{display:grid;gap:10px}
.talk p:first-child::before{content:"▼ エピソードトーク";display:block;font-family:var(--f-display);font-size:12px;color:var(--sky);margin-bottom:4px}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.choice:hover{border-color:var(--pink);background:var(--pink-soft)}
.choice .key{font-family:var(--f-display);color:var(--pink);flex:0 0 auto}
/* result */
.bubble{border-radius:14px;padding:12px 14px;position:relative}
.say{background:var(--sky-soft)}
.say::before{content:"ミナ";display:block;font-size:12px;font-weight:700;color:var(--sky)}
.inner{background:var(--pink-soft);border:1.5px dashed var(--pink)}
.inner::before{content:"ミナの心の声";display:block;font-size:12px;font-weight:700;color:var(--pink)}
.deltas{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700}
.chip{border-radius:999px;padding:2px 10px;border:1px solid currentColor;font-variant-numeric:tabular-nums}
.c-kou{color:var(--ok)} .c-hiki{color:var(--danger)} .c-sara{color:var(--warn)}
.event{border:1.5px solid var(--sky);background:var(--sky-soft);border-radius:10px;padding:14px}
.event h3{font-size:14px;color:var(--sky);margin-bottom:4px}
/* ending */
.end-tag{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;color:var(--muted)}
.end-title{font-size:clamp(28px,7vw,38px)}
.bad .end-title{color:var(--danger)} .good .end-title{color:var(--ok)} .mid .end-title{color:var(--warn)}
.stamp{display:inline-block;font-family:var(--f-display);border:2px solid currentColor;border-radius:6px;padding:2px 10px;transform:rotate(-4deg);font-size:13px}
.diag{display:grid;gap:4px;padding:12px 14px;background:var(--bg);border-radius:8px}
.diag strong{font-family:var(--f-display);font-weight:400;font-size:20px}
.log{display:grid;gap:6px;font-size:13px;color:var(--muted);margin:0;padding-left:1.4em}
.log li.bad{color:var(--danger)}
.collect{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.collect div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0}
.collect div.got{border-color:var(--pink)}
.collect div span{display:block;font-size:11px;color:var(--muted)}
.collect div.locked{color:var(--muted)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
@media (max-width:420px){.hud{gap:8px}.meter b{font-size:11px}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

const EVENTS = [
 {when:s=>s.sara>=35, title:"界隈の噂", text:"女オタの鍵垢で「物販列にいるあの男の人、気をつけて」という投稿が回っているらしい。", d:{sara:10}},
 {when:s=>s.hiki>=40, title:"タイムラインの異変", text:"ミナさんの投稿が急に流れてこなくなった。ミュートされたのかもしれない。", d:{kou:-5}},

const app = document.getElementById("app");
let S;
const clamp=v=>Math.max(0,Math.min(100,v));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function loadSeen(){try{return JSON.parse(localStorage.getItem("wotawota-seen")||"[]")}catch(e){return[]}}
function saveSeen(id){try{const s=new Set(loadSeen());s.add(id);localStorage.setItem("wotawota-seen",JSON.stringify([...s]))}catch(e){}}

function title(){
  const seen=loadSeen();
  app.innerHTML=`
  <div class="panel fade" style="display:grid;gap:16px">
    <h1 class="logo">女ヲタヲタ<br>シミュレータ<small>〜現場の距離感ゲーム〜</small></h1>
    <p class="lead">あなたはアイドル「${OSHI}」を推す男性オタク。現場で出会った同担の女性オタク・ミナさんと、どんな関係になれるでしょうか。</p>
    <p class="notice">「女ヲタヲタ」行動を選ぶほどミナさんはドン引きし、出禁や晒しのバッドエンドへ向かいます。まともな距離感を守れば、良いオタ友になれます。</p>
    <div><label for="name">あなたの名前</label><input id="name" type="text" maxlength="12" value="タカシ"></div>
    <div class="row"><button class="btn" id="start">現場へ行く</button></div>
    <p style="font-size:13px;color:var(--muted)">エンディング ${seen.length} / ${ENDINGS.length} 種 回収済み</p>
    <details>
      <summary>流行りのシミュレータから取り入れたこと</summary>
      <ul>
        <li><b>短いエピソードと二択三択</b>：1/80人生シミュレータ系のように、1場面ずつ読んでタップで選ぶだけ。1周5分ほど。</li>
        <li><b>パラメータの可視化</b>：アイドルオタクシミュレータ系の「お金・体力・推し度」の代わりに、好感度・ドン引き度・晒され度が選択ごとに動きます。</li>
        <li><b>ランダムイベント</b>：途中で状態に応じた出来事が起き、同じ選び方でも展開が少し変わります。</li>
        <li><b>マルチエンディングと回収</b>：6種類のエンディングと出現しやすさ。回収状況はこのブラウザに保存されます。</li>
        <li><b>結果シェア</b>：最後に診断結果をコピーしてSNSに貼れます。</li>
      </ul>
    </details>
  </div>`;
  document.getElementById("start").onclick=()=>{
    const n=document.getElementById("name").value.trim()||"タカシ";
    S={name:n,kou:30,hiki:0,sara:0,ban:false,i:0,log:[]};
    episode();
  };
}

function hud(){
  const m=(cls,lab,v)=>`<div class="meter ${cls}"><b>${lab}<span>${v}</span></b><div class="bar"><i style="width:${v}%"></i></div></div>`;
  return `<div class="hud">${m("m-kou","好感度",S.kou)}${m("m-hiki","ドン引き度",S.hiki)}${m("m-sara","晒され度",S.sara)}</div>`;
}

function episode(){
  const ep=EPISODES[S.i];
  const opts=shuffle(ep.choices.map((c,idx)=>({...c,idx})));
  app.innerHTML=`${hud()}
  <div class="ticket fade"><div class="no">SCENE<strong>${String(S.i+1).padStart(2,"0")}</strong>/ ${EPISODES.length}</div>
    <div class="place"><small>LOCATION</small><span>${esc(ep.place)}</span></div></div>
  <div class="panel talk fade">${ep.talk.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
  <div class="choices fade">${opts.map((c,n)=>`<button class="choice" data-n="${n}"><span class="key">${"ABC"[n]}</span><span>${esc(c.t)}</span></button>`).join("")}</div>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>choose(opts[+b.dataset.n]));
  window.scrollTo({top:0});
}

function chip(cls,lab,v){if(!v)return"";return`<span class="chip ${cls}">${lab} ${v>0?"+":""}${v}</span>`}

function choose(c){
  S.kou=clamp(S.kou+c.k); S.hiki=clamp(S.hiki+c.h); S.sara=clamp(S.sara+c.s);
  S.kouRaw=(S.kouRaw||30)+c.k;
  if(c.ban)S.ban=true;
  S.log.push({t:c.t,bad:c.h>0});
  const done = S.ban || S.hiki>=100 || S.sara>=100 || S.i===EPISODES.length-1;
  let ev="";
  if(!done && EVENT_AFTER.includes(S.i)){
    const pool=EVENTS.filter(e=>e.when(S));
    const cond=pool.filter(e=>Object.keys(e.d).length);
    const e=cond.length && Math.random()<.8 ? cond[0] : pool[Math.floor(Math.random()*pool.length)];
    S.kou=clamp(S.kou+(e.d.kou||0)); S.sara=clamp(S.sara+(e.d.sara||0));
    if(e.d.kou)S.kouRaw+=e.d.kou;
    ev=`<div class="event fade"><h3>イベント：${esc(e.title)}</h3><p>${esc(e.text)}</p>
      <div class="deltas" style="margin-top:6px">${chip("c-kou","好感度",e.d.kou)}${chip("c-sara","晒され度",e.d.sara)}</div></div>`;
  }
  app.innerHTML=`${hud()}
  <div class="panel fade" style="display:grid;gap:12px">
    <p style="font-size:13px;color:var(--muted)">${esc(S.name)}の行動</p>
    <p><b>${esc(c.t)}</b></p>
    <div class="bubble say">${esc(c.say)}</div>
    <div class="bubble inner">${esc(c.inner)}</div>
    <div class="deltas">${chip("c-kou","好感度",c.k)}${chip("c-hiki","ドン引き度",c.h)}${chip("c-sara","晒され度",c.s)}${c.h===0?'<span class="chip c-kou">ちょうどいい距離感</span>':""}</div>
  </div>
  ${ev}
  <div class="row"><button class="btn" id="next">${done?"結末を見る":"次の現場へ"}</button></div>`;
  document.getElementById("next").onclick=()=>{ if(done) ending(); else {S.i++; episode();} };
  document.getElementById("next").focus({preventScroll:true});
}

function diagnosis(){
  const h=S.hiki;
  if(S.ban)return["通報案件","ヲタヲタを通り越して迷惑行為でした。"];
  if(h>=70)return["完全なるヲタヲタ","現場の女性オタクから要注意人物として共有されています。"];
  if(h>=40)return["ヲタヲタ予備軍","悪気がないのが一番こわいタイプ。"];
  if(h>=15)return["ちょいヲタヲタ","ときどき距離感がバグります。"];
  return["紳士オタ","推しと相手の推し活を尊重できる、現場の鑑。"];
}

function ending(){
  const s={...S,kou:S.kouRaw};
  const e=ENDINGS.find(x=>x.test(s));
  saveSeen(e.id);
  const seen=new Set(loadSeen());
  const [dname,dtext]=diagnosis();
  const share=`女ヲタヲタシミュレータで「${e.title}」に到達しました。診断は「${dname}」（ドン引き度${S.hiki}%）。`;
  app.innerHTML=`
  <div class="panel fade ${e.tone}" style="display:grid;gap:14px">
    <p class="end-tag">ENDING ・ 出現しやすさ ${e.rarity}</p>
    <h2 class="end-title">${esc(e.title)}</h2>
    <p>${esc(e.text)}</p>
    <p class="notice">${esc(e.lesson)}</p>
    <div class="diag"><span style="font-size:12px;color:var(--muted)">${esc(S.name)}のヲタヲタ度診断</span><strong>${esc(dname)}</strong><span style="font-size:13px">${esc(dtext)}</span></div>
    ${hud()}
    <div class="row"><button class="btn" id="again">もう一度現場へ</button><button class="btn ghost" id="copy">結果をコピー</button></div>
    <p id="copied" style="font-size:13px;color:var(--muted)" hidden></p>
  </div>
  <div class="panel" style="display:grid;gap:10px">
    <h3 style="font-size:16px">あなたの選択</h3>
    <ol class="log">${S.log.map(l=>`<li class="${l.bad?"bad":""}">${esc(l.t)}</li>`).join("")}</ol>
  </div>
  <div class="panel" style="display:grid;gap:10px">
    <h3 style="font-size:16px">エンディング回収 ${seen.size} / ${ENDINGS.length}</h3>
    <div class="collect">${ENDINGS.map(x=>seen.has(x.id)?`<div class="got">${esc(x.title)}<span>${x.rarity}</span></div>`:`<div class="locked">？？？<span>${x.rarity}</span></div>`).join("")}</div>
  </div>`;
  document.getElementById("again").onclick=title;
  document.getElementById("copy").onclick=()=>{
    const out=document.getElementById("copied");
    const show=t=>{out.hidden=false;out.textContent=t};
    try{navigator.clipboard.writeText(share).then(()=>show("コピーしました"),()=>show(share))}catch(err){show(share)}
  };
  window.scrollTo({top:0});
}

title();
</script>

</body>
</html>
